[project]
name = "cfrec"
version = "0.2.0"
description = "Fast methods for collaborative filtering: linear autoencoders, sparse/low-rank approximations, MRF, RecVAE"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.0",
    "bottleneck>=1.3",
    "sparse-dot-topn>=1.1",
]

[project.optional-dependencies]
vae = ["torch>=2.2"]
plots = ["matplotlib>=3.8"]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cfrec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
